name: TrainShop Starter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-api:
    name: Tester API
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer dépendances API
        working-directory: api
        run: npm install

      - name: Vérifier la qualité du code
        working-directory: api
        run: npm run lint

      - name: Lancer les tests API
        working-directory: api
        run: npm test

  docker-build:
    name: Vérifier les builds Docker
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build image API
        run: docker build -t trainshop-api ./api

      - name: Build image Frontend
        run: docker build -t trainshop-frontend ./frontend